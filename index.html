<!DOCTYPE html>
<html lang="hr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panasonic Timer</title>
    <link rel="manifest" href="manifest.json">
    <style>
        /* Direktni CSS - popravlja izgled sa slike 1000058898.png */
        body {
            background: #0a0a0c;
            color: white;
            font-family: sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .card {
            background: #16161a;
            padding: 2rem;
            border-radius: 20px;
            width: 90%;
            max-width: 350px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 1px solid #2d2d35;
        }
        .icon {
            width: 60px; /* Popravlja ogromnu ikonu sa slike */
            height: 60px;
            margin-bottom: 1rem;
        }
        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border-radius: 10px;
            border: 1px solid #333;
            background: #222;
            color: white;
            font-size: 1.2rem;
            box-sizing: border-box;
        }
        .result-box {
            background: #4f46e5;
            padding: 15px;
            border-radius: 15px;
            margin-top: 20px;
        }
        .result-val {
            font-size: 3rem;
            font-weight: bold;
            display: block;
        }
        button {
            background: none;
            border: none;
            color: #818cf8;
            cursor: pointer;
            font-size: 0.8rem;
            text-decoration: underline;
        }
    </style>
</head>
<body>

<div class="card">
    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
    </svg>
    
    <h2 style="margin: 0 0 20px 0;">Pekač Timer</h2>

    <div style="text-align: left;">
        <label style="font-size: 0.8rem; color: #aaa;">SADA JE:</label>
        <input type="time" id="currentTime">
        <button onclick="setNow()">OSVJEŽI VRIJEME</button>
        
        <label style="font-size: 0.8rem; color: #aaa; display: block; margin-top: 15px;">KRUH GOTOV U:</label>
        <input type="time" id="targetTime" value="06:20">
    </div>

    <div class="result-box">
        <span style="font-size: 0.7rem; opacity: 0.8;">POSTAVKA PEKAČA:</span>
        <span id="result" class="result-val">--:--</span>
    </div>

    <p style="font-size: 0.7rem; color: #666; margin-top: 20px;">
        Izračunato za Panasonic sustav odgode.
    </p>
</div>

<script>
    const currentInput = document.getElementById('currentTime');
    const targetInput = document.getElementById('targetTime');
    const resultDisplay = document.getElementById('result');

    function setNow() {
        const now = new Date();
        currentInput.value = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
        calculate();
    }

    function calculate() {
        const [currH, currM] = currentInput.value.split(':').map(Number);
        const [tarH, tarM] = targetInput.value.split(':').map(Number);
        let diff = (tarH * 60 + tarM) - (currH * 60 + currM);
        if (diff <= 0) diff += 1440;
        resultDisplay.innerText = `${Math.floor(diff / 60)}:${String(diff % 60).padStart(2, '0')}`;
    }

    [currentInput, targetInput].forEach(i => i.addEventListener('input', calculate));
    setNow();
</script>

</body>
</html>
